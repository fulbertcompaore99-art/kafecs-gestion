name: ewkef
description: "Application de gestion pour quincaillerie KAFECS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Base de données locale ---
  sqflite: ^2.3.3
  sqflite_common_ffi: 2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # --- Gestion d'état ---
  provider: ^6.1.2

  # --- Authentification / sécurité ---
  crypto: ^3.0.3

  # --- Génération et export de factures ---
  pdf: ^3.11.0
  printing: ^5.15.0
  path_provider_android: ^2.2.10
  share_plus: ^13.3.0

  # --- Utilitaires ---
  intl: ^0.19.0
  uuid: ^4.4.0

  # --- Synchronisation cloud ---
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  connectivity_plus: ^6.1.5
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/images/entete_facture.png

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

dependency_overrides:
  sqlite3: ^2.4.6